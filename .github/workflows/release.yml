name: Publish source release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify version and package tagged source
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\([0-9.]*\)"$/\1/p' edmc/load.py)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_TAG" == "v$version" ]]
          base="ModernOverlayVR-$RELEASE_TAG"
          git archive --format=zip --prefix="$base/" --output="$base.zip" HEAD
          unzip -tq "$base.zip"
          sha256sum "$base.zip" > "$base.zip.sha256"
          sha256sum -c "$base.zip.sha256"
          hash=$(cut -d ' ' -f 1 "$base.zip.sha256")
          printf 'Installer and source: `%s.zip`\n\nSHA-256: `%s`\n\n[VirusTotal hash lookup](https://www.virustotal.com/gui/file/%s)\n' "$base" "$hash" "$hash" > release-notes.md

      - name: Scan release ZIP with VirusTotal
        shell: bash
        timeout-minutes: 20
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          : "${VT_API_KEY:?Set the VT_API_KEY repository secret before releasing}"
          zip="ModernOverlayVR-$RELEASE_TAG.zip"
          api="https://www.virustotal.com/api/v3"
          vt=(curl --fail --silent --show-error --max-time 60 -H "x-apikey: $VT_API_KEY")
          analysis=$("${vt[@]}" -F "file=@$zip" "$api/files" | jq -er '.data.id | strings | select(length > 0) | @uri')
          for attempt in {1..36}; do
            sleep 30
            report=$("${vt[@]}" --retry 2 --retry-delay 30 "$api/analyses/$analysis")
            status=$(jq -er '.data.attributes.status' <<< "$report")
            case "$status" in
              queued|in-progress) continue ;;
              completed) ;;
              *) echo "::error::Unexpected VirusTotal status: $status"; exit 1 ;;
            esac
            jq '.data.attributes.stats' <<< "$report"
            if ! jq -e '.data.attributes.stats | .malicious == 0 and .suspicious == 0 and (.undetected + .harmless > 0)' <<< "$report" >/dev/null; then
              echo "::error::VirusTotal reported detections or insufficient scan results"
              exit 1
            fi
            echo "VirusTotal scan passed for $zip"
            exit 0
          done
          echo "::error::Timed out waiting for VirusTotal"
          exit 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="ModernOverlayVR-$RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$base.zip" "$base.zip.sha256" \
            --verify-tag --title "ModernOverlayVR $RELEASE_TAG" --notes-file release-notes.md
