name: Publish source release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify version and package tagged source
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\([0-9.]*\)"$/\1/p' edmc/load.py)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_TAG" == "v$version" ]]
          base="ModernOverlayVR-$RELEASE_TAG"
          git archive --format=zip --prefix="$base/" --output="$base.zip" HEAD
          unzip -tq "$base.zip"
          sha256sum "$base.zip" > "$base.zip.sha256"
          sha256sum -c "$base.zip.sha256"
          hash=$(cut -d ' ' -f 1 "$base.zip.sha256")
          printf 'Installer and source: `%s.zip`\n\nSHA-256: `%s`\n\n[VirusTotal hash lookup](https://www.virustotal.com/gui/file/%s)\n' "$base" "$hash" "$hash" > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="ModernOverlayVR-$RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$base.zip" "$base.zip.sha256" \
            --verify-tag --title "ModernOverlayVR $RELEASE_TAG" --notes-file release-notes.md
